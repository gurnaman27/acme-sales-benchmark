[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-sales-benchmark"
version = "0.4.0"
description = "Enterprise Agent Benchmark: Evaluating AI Agents in Multi-Step Sales Operations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
llm = [
    "openai",
    "python-dotenv",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.24.0",
]

[project.scripts]
run-benchmark = "acme.green_agent.cli:main"

[tool.setuptools.packages.find]
include = ["acme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
